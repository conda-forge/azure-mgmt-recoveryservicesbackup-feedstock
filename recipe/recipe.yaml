schema_version: 1

context:
  name: azure-mgmt-recoveryservicesbackup
  version: "11.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/azure_mgmt_recoveryservicesbackup-${{ version }}.tar.gz
  sha256: b7b4ab1746e8a920b80c1f12a7e806dc13f0ba5cf7e357c7b457c5626fe26de4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - setuptools
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.6.0
    - azure-mgmt-core >=1.6.0
    - isodate >=0.6.1
tests:
  - python:
      imports:
        - azure.mgmt.recoveryservicesbackup
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
about:
  summary: Microsoft Azure Recovery Services Backup Management Client Library for Python
  license: MIT
  license_file:
    - LICENSE
    - LICENSE.txt
  homepage: https://github.com/Azure/azure-sdk-for-python

extra:
  recipe-maintainers:
    - janjagusch
